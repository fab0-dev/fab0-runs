summary: 'The spec covers how `apply` handles a branch whose GitHub copy already has
  every local commit: it brings the local branch forward under D42 and pushes nothing,
  and it pushes only when the local branch has commits GitHub lacks. Its eight scenarios
  cover run and unit branches, a local branch ahead, equal commits, a diverged branch
  (which still fails), a clean checkout, a checkout with changes, and a repository
  with no origin. T1 fixes the single shared push in fab0-core''s `plugins/fab0/lib/fab0_engine/git.py`
  and tests it in a new `tests/test_push.py`. T2, which depends on T1, updates `docs/explanation/branching.md`
  in docs. Both files are in /Users/zhen/Work/Fab0/fab0/.git/fab0/out/50/spec-1/ (spec.md,
  tasks.yaml).'
