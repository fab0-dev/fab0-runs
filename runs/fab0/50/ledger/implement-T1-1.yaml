summary: 'Writer.push in plugins/fab0/lib/fab0_engine/git.py now compares the local
  branch with origin/<branch> (no network call). Same commit: nothing is pushed. Local
  is an ancestor of origin''s: the local branch is brought forward with the existing
  set_branch (update-ref when not checked out, ff-only merge in a clean checkout)
  and nothing is pushed. If the checkout has changes, the branch is left where it
  was and apply goes on. Otherwise it pushes as before, so a diverged branch is refused
  by GitHub. The push error now reads ''git push of <branch> failed in <repo>: ...'',
  naming both. No origin remote: no-op. No force push anywhere. Added tests/test_push.py
  with 7 tests covering S1/S2 (one test), S3, S4, S5, S6, S7, S8, using a bare origin
  and a second clone. Ran `uv run pytest tests/test_push.py` (7 passed) and the full
  suite `uv run pytest tests` (399 passed, 1 xfailed). Not touched: caller code and
